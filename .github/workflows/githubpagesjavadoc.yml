name: Publish Javadoc to GitHub Pages

on:
  push:
    branches:
      - main  # or 'master', or your default branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle/Maven and Generate Javadoc
        run: |
          # Uncomment/modify according to your build system:
          # ./gradlew javadoc
          # or for Maven:
          mvn javadoc:javadoc

      - name: Publish Javadoc
        uses: MathieuSoysal/deploy-publish-javadoc@v2
        with:
          folder: ./target/site/apidocs # or ./build/docs/javadoc for Gradle
